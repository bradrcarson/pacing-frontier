<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The brand mark's four signal squares in a 2x2 grid: full (Stop), half (Pace), core (Contain), open (Continue). -->
  <rect width="32" height="32" rx="6" fill="#191c20"/>
  <g fill="none" stroke="#ffffff" stroke-width="2">
    <rect x="18" y="6" width="8" height="8"/>
    <rect x="6" y="18" width="8" height="8"/>
    <rect x="18" y="18" width="8" height="8"/>
  </g>
  <g fill="#ffffff">
    <rect x="5" y="5" width="10" height="10"/>
    <rect x="17" y="10" width="10" height="5"/>
    <rect x="8" y="20" width="4" height="4"/>
  </g>
</svg>
